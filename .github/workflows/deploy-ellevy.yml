name: Deploy Ellevy Consultoria

on:
  push:
    branches:
      - main
    paths:
      - 'ellevy-consultoria-contabil/**' # Monitora apenas esta pasta

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build Project
        working-directory: ./ellevy-consultoria-contabil
        run: |
          npm install
          npm run build

      - name: Deploy via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Envia apenas o conteúdo da pasta dist (build final)
          local-dir: ./ellevy-consultoria-contabil/dist/ 
          # Pasta de destino no seu FTP da Hostinger
          server-dir: ./